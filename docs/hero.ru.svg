<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">RepoHarvester</title>
  <desc id="desc">RepoHarvester превращает любой git-репозиторий в один текстовый файл с оценкой токенов для каждого файла. Справа начало настоящего результата для psf/requests: 92 файла, около 154.6k токенов, полоски показывают, какие файлы занимают больше всего контекста.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="400" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#0f2233"/>

    <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <text x="56" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#8aa2b8">$ uvx repoharvester &lt;repo&gt;</text>
      <text x="54" y="172" font-size="68" font-weight="700" fill="#f2f5f8" letter-spacing="-1">RepoHarvester</text>
      <text id="line1" x="56" y="232" font-size="25" fill="#c9d6e3">Git-репозиторий целиком в одном файле,</text>
      <text id="line2" x="56" y="270" font-size="25" fill="#c9d6e3">с оценкой токенов для каждого файла.</text>
      <text id="meta" x="56" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8aa2b8" xml:space="preserve">CLI и десктопный GUI    без зависимостей    MIT</text>
    </g>

    <g id="output-sheet" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#1d3347">
      <rect x="650" y="44" width="500" height="400" rx="14" fill="#f2f5f8"/>
      <text x="678" y="90" font-weight="700">## requests</text>
      <text x="678" y="120" font-weight="700">### Files: 92, ~154.6k tokens</text>
      <g id="file-list">
        <text x="678" y="156">README.md</text>
        <text x="678" y="186">HISTORY.md</text>
        <text x="678" y="216">src/requests/models.py</text>
        <text x="678" y="246">src/requests/sessions.py</text>
        <text x="678" y="276">src/requests/api.py</text>
        <text x="678" y="304" fill="#8aa2b8">…</text>
      </g>
      <g id="token-bars" fill="#e8a33d">
        <rect x="972" y="146" width="3" height="10" rx="2"/>
        <rect x="972" y="176" width="70" height="10" rx="2"/>
        <rect x="972" y="206" width="45" height="10" rx="2"/>
        <rect x="972" y="236" width="37" height="10" rx="2"/>
        <rect x="972" y="266" width="8" height="10" rx="2"/>
      </g>
      <g id="token-labels" text-anchor="end" fill="#5c7389">
        <text x="1128" y="156">~731</text>
        <text x="1128" y="186">~16.1k</text>
        <text x="1128" y="216">~10.4k</text>
        <text x="1128" y="246">~8.5k</text>
        <text x="1128" y="276">~1.8k</text>
      </g>
      <text x="678" y="344" font-weight="700">### src/requests/api.py</text>
      <text x="678" y="374" fill="#5c7389">"""</text>
      <text x="678" y="404" fill="#5c7389">requests.api</text>
    </g>
  </g>
</svg>
