[project]
name = "repoharvester"
version = "0.2.1"
description = "Clone a git repo (or read a folder) and compile its text files into a single file"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
gui = ["customtkinter>=5.2"]

[project.scripts]
repoharvester = "repoharvester:main"
repoharvester-gui = "repoharvester_gui:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["repoharvester.py", "repoharvester_gui.py"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "C4", "PTH", "RUF"]

[tool.uv]
# uv's bundled CPython ships Tk without Xft (no antialiasing, no system fonts), so the GUI looks broken.
python-preference = "system"
