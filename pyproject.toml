[project]
name = "repoharvester"
version = "0.2.1"
description = "Clone a git repo or read a folder and compile its text files into one file for LLM context. CLI plus optional GUI, no dependencies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["llm", "llm-context", "prompt", "chatgpt", "claude", "git", "repository", "code-to-text", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/octrow/RepoHarvester"
Changelog = "https://github.com/octrow/RepoHarvester/blob/main/CHANGELOG.md"
Issues = "https://github.com/octrow/RepoHarvester/issues"

[project.optional-dependencies]
gui = ["customtkinter>=5.2"]

[project.scripts]
repoharvester = "repoharvester:main"
repoharvester-gui = "repoharvester_gui:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["repoharvester.py", "repoharvester_gui.py"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "C4", "PTH", "RUF"]

[tool.uv]
# uv's bundled CPython ships Tk without Xft (no antialiasing, no system fonts), so the GUI looks broken.
python-preference = "system"
